name: Gemini CLI Assistant

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  gemini-assistant:
    # Only run if the comment contains '@gemini-cli'
    if: contains(github.event.comment.body, '@gemini-cli')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false

      - name: Run Gemini CLI Assistant
        uses: google-github-actions/run-gemini-cli@387c8ddb7a72078825da941758b811b9153c71e8
        with:
          command: "assistant"
        env:
          # Note: This requires a GEMINI_API_KEY secret to be set in the repository settings.
          # You can obtain one from Google AI Studio (https://aistudio.google.com/)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
