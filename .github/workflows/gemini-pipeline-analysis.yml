name: Gemini Pipeline Analysis

on:
  workflow_run:
    # Triggers when either NOIR or Super-Linter finishes
    workflows: ["OWASP Noir Security Scan", "Super-Linter Quality Assurance"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  gemini-analyze:
    name: Analyze Pipeline Failure
    # Only run if the triggering workflow failed
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false

      - name: Run Gemini Pipeline Analysis
        uses: google-github-actions/run-gemini-cli@387c8ddb7a72078825da941758b811b9153c71e8
        with:
          # Custom prompt for the CLI to analyze the failure
          command: 'analyze --context="A pipeline has failed. Please analyze the logs and suggest fixes."'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
