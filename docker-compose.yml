services:
  app:
    build: .
    ports:
      - "3001:3001"
    environment:
      # Use an absolute path inside the persistent volume for SQLite
      - DATABASE_URL=file:/app/data/sqlite.db
      # Pull JWT_SECRET from the host environment (or .env file) instead of hardcoding
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - app-data:/app/data
    restart: unless-stopped

volumes:
  app-data:
